<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>351 — Every Town in Massachusetts, by What It Charges</title>
<meta name="description" content="A spinnable 3D Massachusetts where all 351 municipalities rise by what they charge: property tax rate, real burden per resident, median home price and the business rate premium." />
<link rel="canonical" href="https://duncanburns2013-dot.github.io/Massachusetts-Data-Hub/ma-351.html" />

<!--
  This page exists because social crawlers refuse the map itself.

  ma-351-3d-map.html is ~5MB (deck.gl and every town polygon are inlined so the
  map works offline), and Twitter's validator rejects it outright: "Fetching the
  page failed because the response is too large." Facebook, LinkedIn and Slack
  have similar caps. So the shareable URL is this small document, which carries
  the card tags and frames the map for anyone who actually opens it.
-->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Massachusetts Data Hub" />
<meta property="og:url" content="https://duncanburns2013-dot.github.io/Massachusetts-Data-Hub/ma-351.html" />
<meta property="og:title" content="351 — Every Town in Massachusetts, by What It Charges" />
<meta property="og:description" content="A spinnable 3D map of all 351 municipalities: property tax rate, the real burden per resident, median home price and the business rate premium. Built from DLS, MLS PIN and MassGIS data." />
<meta property="og:image" content="https://duncanburns2013-dot.github.io/Massachusetts-Data-Hub/og-351.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Massachusetts with all 351 towns shaded by residential property tax rate." />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@DuncanBurnsMA" />
<meta name="twitter:creator" content="@DuncanBurnsMA" />
<meta name="twitter:title" content="351 — Every Town in Massachusetts, by What It Charges" />

<meta name="twitter:image:alt" content="Massachusetts with all 351 towns shaded by residential property tax rate." />

<style>
  html, body { height: 100%; margin: 0; background: #12324C; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; color: #E6EEF6; text-align: center; padding: 24px; }
  .fallback a { color: #fff; }
</style>
<!-- shared theme: redefines the tokens above; see assets/hub-theme.css -->
<link rel="stylesheet" href="https://use.typekit.net/irk1bar.css">
<link rel="stylesheet" href="assets/hub-theme.css">

</head>
<body>
  <!--
    The ?v= is a cache buster and it matters here. The map is ~5MB, so browsers
    hold onto it hard, and an update looks like "it didn't go live" even after a
    successful deploy. BUMP THIS whenever ma-351-3d-map.html changes - it should
    match the build stamp shown in the map's bottom-right corner.
  -->
  <iframe src="ma-351-3d-map.html?v=20260816-1252" title="351 - every town in Massachusetts in 3D"
          allow="fullscreen" loading="eager"></iframe>
  <noscript>
    <div class="fallback">
      <p>This map needs JavaScript and WebGL.<br />
      <a href="ma-351-3d-map.html">Open the map directly</a></p>
    </div>
  </noscript>
</body>
</html>
