<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://massachusettsdatahub.com/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://massachusettsdatahub.com/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="https://massachusettsdatahub.com/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="https://massachusettsdatahub.com/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="https://massachusettsdatahub.com/apple-touch-icon.png">
<title>Page not found &mdash; Massachusetts Data Hub</title>
<meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/irk1bar.css">
<style>
:root{--ink:#0B1113;--cranberry:#680A1D;--bay-blue:#14558F;--bg:#E9EBEA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(80% 90% at 10% 0%,rgba(104,10,29,.10),transparent 60%),
             radial-gradient(70% 90% at 92% 6%,rgba(20,85,143,.11),transparent 58%),var(--bg);
  color:var(--ink);font-family:"halyard-text","DM Sans",system-ui,sans-serif;padding:28px}
main{max-width:620px;text-align:center}
.code{font-family:"ibm-plex-mono",ui-monospace,monospace;font-size:12px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--bay-blue)}
h1{font-family:"halyard-display","DM Sans",system-ui,sans-serif;font-weight:700;
  font-size:clamp(30px,5.5vw,56px);letter-spacing:-.03em;line-height:1.05;margin:14px 0 0}
.ramp{display:block;height:3px;border-radius:2px;margin:22px auto;
  background:linear-gradient(90deg,#12467F,#3D82BC,#8FB9D6,#CFC7B4,#F2A65A,#DC5127,#8E0B22)}
p{font-size:16px;line-height:1.6;color:rgba(11,17,19,.82);margin:0 auto;max-width:52ch}
ul{list-style:none;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  margin:26px 0 0;padding:0}
a.chip{display:inline-block;text-decoration:none;font-family:"ibm-plex-mono",ui-monospace,monospace;
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 14px;border-radius:8px;color:var(--bay-blue);
  background:rgba(20,85,143,.08);border:1px solid rgba(20,85,143,.25)}
a.chip:hover{background:rgba(20,85,143,.16);border-color:rgba(20,85,143,.45)}
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>That page isn&rsquo;t here.</h1>
  <span class="ramp" aria-hidden="true"></span>
  <p>The address may be mistyped, or the page may have been folded into another
  one &mdash; several dashboards were merged as the site grew.</p>
  <ul>
    <li><a class="chip" href="./">The instrument</a></li>
    <li><a class="chip" href="./#dashboards">Dashboards</a></li>
    <li><a class="chip" href="videos.html">Videos</a></li>
    <li><a class="chip" href="about.html">About</a></li>
  </ul>
</main>
</body>
</html>
