name: Update Employment Dashboard

on:
  schedule:
    - cron: '30 14 15-21 * 5'
    - cron: '0 13 1-7 * 5'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no new data'
        required: false
        default: 'false'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Fetch BLS data and update dashboard
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          cd scripts
          node fetch-bls-data.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet employment-dashboard.html data/employment-latest.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add employment-dashboard.html
          git add data/employment-latest.json
          git commit -m "Auto-update: Employment data $(date +'%B %Y')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
