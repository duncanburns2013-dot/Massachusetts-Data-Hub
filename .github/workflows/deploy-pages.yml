name: Deploy to GitHub Pages

# Single, serialized deploy path for the site. Every data-refresh workflow that
# commits to main triggers this; the concurrency group ensures only one deploy
# runs at a time (later ones queue instead of colliding), which fixes the
# intermittent "Deployment failed, try again later" errors from overlapping
# auto-deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
