name: Deploy to GitHub Pages

# Single, serialized, self-healing deploy path for the site.
#
# Triggers:
#   - workflow_run: fires after each data-refresh workflow finishes. This is the
#     primary trigger, because those workflows commit with the default
#     GITHUB_TOKEN and GitHub does NOT run `on: push` workflows for GITHUB_TOKEN
#     commits (anti-recursion rule). workflow_run fires regardless of token.
#   - schedule: every 3h safety net so any missed/failed deploy self-heals fast.
#   - push: human commits to main (e.g. content or OG-image edits).
#   - workflow_dispatch: manual.
#
# Resilience:
#   - concurrency group "pages" serializes deploys so overlapping data commits
#     never collide (the original cause of "Deployment failed, try again later").
#   - the deploy step is retried up to 3x, because GitHub's Pages backend
#     intermittently returns a transient "try again later" even for a lone
#     deploy; a single failure must not leave a data update unpublished.

on:
  workflow_run:
    workflows:
      - "Update All Data Sources"
      - "Update CBP Encounters"
      - "Update Census Data (ACS)"
      - "Update Cumulative CPI Data"
      - "Update Employment Dashboard"
      - "Update Energy Data"
      - "Update IRS SOI Migration"
      - "Update MLS Figures"
    types: [completed]
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://duncanburns2013-dot.github.io/Massachusetts-Data-Hub/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
