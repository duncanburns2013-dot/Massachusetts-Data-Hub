# .github/workflows/update-all.yml
#
# Master workflow: runs ALL data updaters in sequence.
# Use this for a full refresh -- or trigger individual workflows for specific sources.
#
# Required secrets: BLS_API_KEY, EIA_API_KEY, FRED_API_KEY, CENSUS_API_KEY
# No key needed for: CBP encounters, IRS SOI

name: "Update All Data Sources"

on:
  workflow_dispatch:   # Manual only -- individual workflows handle scheduling

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: cd scripts && npm install

      # -- Existing connectors --

      - name: "Employment (BLS)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: cd scripts && node fetch-bls-data.js

      - name: "Energy (EIA)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-energy-dashboard.py

      - name: "Affordability (BLS + EIA)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-affordability-dashboard.py

      - name: "Tax/Budget - EIA + CPI (BLS)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-tax-budget-dashboard.py

      - name: "Tax/Budget - Cumulative Inflation (BLS + FRED)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_cumulative_inflation.py

      # -- New connectors --

      - name: "Census (ACS 5-Year)"
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-census-data.py

      - name: "CBP Encounters"
        run: python update-cbp-encounters.py

      - name: "IRS SOI Migration"
        run: python update-irs-soi-migration.py

      # -- Commit everything --

      - name: Commit all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes across any data source."
          else
            DATE=$(date -u +'%B %d, %Y')
            git commit -m "Full data refresh - ${DATE}

          Sources: BLS | EIA | FRED | Census ACS | Treasury | CBP | IRS SOI"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          echo "### Full Data Refresh" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Source | JSON |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          for f in data/*.json; do
            name=$(basename "$f" .json)
            echo "| $name | OK |" >> $GITHUB_STEP_SUMMARY
          done
