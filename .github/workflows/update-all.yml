# .github/workflows/update-all.yml
#
# Master workflow: runs ALL data updaters in sequence.
# Use this for a full refresh -- or trigger individual workflows for specific sources.
#
# Required secrets: BLS_API_KEY, EIA_API_KEY, FRED_API_KEY, CENSUS_API_KEY
# No key needed for: CBP encounters, IRS SOI

name: "Update All Data Sources"

on:
  workflow_dispatch:   # Manual only -- individual workflows handle scheduling

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: cd scripts && npm install

      # -- Existing connectors --

      - name: "Employment (BLS)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: cd scripts && node fetch-bls-data.js

      - name: "Energy (EIA)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-energy-dashboard.py

      - name: "Cost of living (BEA + MIT)"
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-cost-of-living.py

      - name: "Tax/Budget - EIA + CPI (BLS)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-tax-budget-dashboard.py

      - name: "Tax/Budget - Cumulative Inflation (BLS + FRED)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_cumulative_inflation.py

      # -- New connectors --

      - name: "Census (ACS 5-Year)"
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-census-data.py

      # cbp.gov 403s GitHub's IP ranges, so this step's normal outcome on a
      # hosted runner is exit 75 ("blocked, nothing written"). Left bare, that
      # failed the step and aborted the job BEFORE the commit step -- throwing
      # away the BLS/EIA/BEA/Census refreshes that had already succeeded.
      # The real CBP refresh now runs on the self-hosted runner
      # (duncanburns2013-dot/ma-data-hub-runner); this is only a courtesy retry.
      - name: "CBP Encounters (optional -- blocked from hosted runners)"
        run: |
          set +e
          python update-cbp-encounters.py
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::notice::cbp.gov blocked the hosted runner, as expected. The self-hosted runner owns this feed."
            exit 0
          fi
          exit "$code"

      - name: "IRS SOI Migration"
        run: python update-irs-soi-migration.py

      # -- Commit everything --

      - name: Commit all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes across any data source."
            exit 0
          fi
          DATE=$(date -u +'%B %d, %Y')
          git commit -m "Full data refresh - ${DATE}

          Sources: BLS | EIA | FRED | Census ACS | Treasury | CBP | IRS SOI"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: Job summary
        if: always()
        run: |
          echo "### Full Data Refresh" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Source | JSON |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          for f in data/*.json; do
            name=$(basename "$f" .json)
            echo "| $name | OK |" >> $GITHUB_STEP_SUMMARY
          done
