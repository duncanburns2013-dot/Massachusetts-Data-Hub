# .github/workflows/update-all.yml
#
# Master workflow: runs ALL data updaters in sequence.
# Use this for a full refresh â or trigger individual workflows for specific sources.
#
# Required secrets: BLS_API_KEY, EIA_API_KEY, FRED_API_KEY, CENSUS_API_KEY
# No key needed for: Treasury gold, CBP encounters, IRS SOI

name: "ð Update All Data Sources"

on:
  workflow_dispatch:   # Manual only â individual workflows handle scheduling

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: cd scripts && npm install

      # ââ Existing connectors ââ

      - name: "ð Employment (BLS)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: cd scripts && node fetch-bls-data.js

      - name: "ð¡ Energy (EIA)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-energy-dashboard.py

      - name: "ð° Affordability (BLS + EIA)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-affordability-dashboard.py

      - name: "ð Tax/Budget â EIA + CPI (BLS)"
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-tax-budget-dashboard.py

      - name: "ð Tax/Budget â Cumulative Inflation (BLS + FRED)"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_cumulative_inflation.py

      # ââ New connectors ââ

      - name: "ðï¸ Census (ACS 5-Year)"
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-census-data.py

      - name: "ð¥ Treasury Gold Reserve"
        run: python update-treasury-gold.py

      - name: "ð CBP Encounters"
        run: python update-cbp-encounters.py

      - name: "ð IRS SOI Migration"
        run: python update-irs-soi-migration.py

      # ââ Commit everything ââ

      - name: Commit all changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes across any data source."
          else
            DATE=$(date -u +'%B %d, %Y')
            git commit -m "ð Full data refresh â ${DATE}

          Sources: BLS Â· EIA Â· FRED Â· Census ACS Â· Treasury Â· CBP Â· IRS SOI"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          echo "### Full Data Refresh" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Source | JSON |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          for f in data/*.json; do
            name=$(basename "$f" .json)
            echo "| $name | â |" >> $GITHUB_STEP_SUMMARY
          done
