name: Update Energy Data

# Schedule is aligned to EIA's publication calendar, not to a round number.
#
# EIA Electric Power Monthly lands around the 23rd-26th with data for two
# months prior (May 2026 data was published 2026-07-23). The old monthly run on
# the 15th therefore fired about a week BEFORE each release and then slept for
# a month: the 2026-07-15 run correctly pulled April data, EIA published May on
# 2026-07-23, and the dashboard would have sat on April until 2026-08-15. Every
# release was reaching the site roughly three weeks late, by construction.
#
# Running on the 26th picks each release up within days. The 2nd is a catch-up
# for months when EIA slips past the 26th; the updater rewrites the same values
# when nothing has changed, and the commit step is a no-op on an unchanged tree,
# so the extra run costs nothing.
on:
  schedule:
    - cron: "0 10 26 * *"
    - cron: "0 10 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update energy dashboard
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-energy-dashboard.py

      # The chain was broken in three places at once and each break hid the
      # next: EIA published June, energy-dashboard.html advanced, but
      # burden-constants.json was written by nothing, the commit step staged
      # no JSON, and this propagator -- which pushes the constants into
      # tax-burden-dashboard.html and tax-burden-nh-comparison.html -- ran on
      # no schedule at all. Fixing only the first would have left the burden
      # dashboards on the old figure regardless. Needs no API key: it reads
      # the JSON the step above just wrote. (2026-09-09)
      - name: Propagate burden constants into the burden dashboards
        run: python update-burden-constants.py

      # Gasoline, diesel and residential natural gas. These were hand-typed until
      # 2026-08 and every series had drifted -- worst, the Equivalence tab was
      # billing gasoline at the 2025 annual average ($2.97) while Massachusetts
      # paid $4.22. Weekly retail data, so this runs on the same monthly cadence
      # as the electricity pull rather than waiting on EIA's monthly calendar.
      - name: Update fuel prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-fuel-prices.py

      - name: Update tax-budget dashboard
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-tax-budget-dashboard.py

      - name: Commit if changed
        run: |
          # Globs are QUOTED so git expands them, not the shell: unquoted *.html
          # only matches the repo root, and data/*.json would not have been
          # staged at all. burden-constants.json sat a full EIA release behind
          # the dashboard because nothing wrote it AND this step would have
          # dropped the write if anything had. (Found 2026-09-09.)
          if git diff --quiet -- '*.html' 'data/*.json'; then
            echo "No data changes - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'data/*.json'
          git commit -m "data: auto-update EIA + BLS data"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
