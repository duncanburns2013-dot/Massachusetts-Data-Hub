name: Update Energy Data

on:
  schedule:
    - cron: "0 10 15 * *"  # 15th of each month when EIA publishes
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update energy dashboard
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update-energy-dashboard.py
      - name: Commit if changed
        run: |
          git diff --quiet energy-dashboard.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add energy-dashboard.html
          git commit -m "data: auto-update EIA electricity rates"
          git push
