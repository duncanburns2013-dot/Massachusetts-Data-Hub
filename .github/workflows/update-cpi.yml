# .github/workflows/update-cpi.yml
#
# Runs the cumulative inflation updater daily across the 10th-16th of each month.
# BLS releases the prior month's CPI between the 10th and the 14th - the exact day
# moves every month (see https://www.bls.gov/schedule/news_release/cpi.htm), so a
# single fixed day misses roughly one release in three. Running the whole window is
# safe: the "Check for changes" step below skips the commit when the data is
# unchanged, so this commits exactly once, on whichever day the release lands.
# Also runs whenever you push changes to the updater script itself,
# and can be triggered manually from the Actions tab.

name: Update Cumulative CPI Data

on:
  schedule:
    # 14:00 UTC each day from the 10th to the 16th.
    # Release is 08:30 ET (12:30 UTC), so 14:00 UTC clears it with margin to spare.
    - cron: "0 14 10-16 * *"

  # Re-run automatically if you edit the updater script
  push:
    paths:
      - "scripts/update_cumulative_inflation.py"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update-cpi:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # needed to push the updated HTML back to the repo
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      # -- 1. Check out the repo --
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -- 2. Set up Python --
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The script uses only stdlib (json, re, urllib) - no pip install needed.

      # -- 3. Run the updater --
      - name: Fetch BLS data and update dashboard
        env:
          # Optional: register at https://data.bls.gov/registrationEngine/
          # and add BLS_API_KEY as a repo secret for higher API rate limits.
          # The script works without it (25 series/day free tier).
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/update_cumulative_inflation.py

      # -- 4. Check if anything actually changed --
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet tax-budget-dashboard.html \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      # -- 5. Commit and push if the HTML changed --
      - name: Commit updated dashboard
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tax-budget-dashboard.html
          # Include the status file if it was written
          git add cpi_update_status.txt 2>/dev/null || true
          # Read the status line for the commit message
          STATUS=$(cat cpi_update_status.txt 2>/dev/null || echo "BLS CPI data update")
          git commit -m "chore: auto-update cumulative CPI data - ${STATUS}"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      # -- 6. No-op message if data hasn't changed --
      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "BLS data unchanged since last run - no commit needed."

      # -- 7. Write a job summary --
      - name: Write job summary
        if: always()
        run: |
          echo "### CPI Update Result" >> $GITHUB_STEP_SUMMARY
          if [ -f cpi_update_status.txt ]; then
            cat cpi_update_status.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Changed: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
