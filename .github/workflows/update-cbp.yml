# .github/workflows/update-cbp.yml
#
# Downloads CBP encounter data and updates immigration-dashboard.html.
# CBP updates monthly. Auto-fetch may fail if they change CSV URLs;
# in that case, manually download the CSV from the CBP Data Portal,
# save it to data/cbp-encounters-latest.csv, and push.

name: Update CBP Encounters

# SCHEDULE RETIRED 2026-09-02. cbp.gov answers GitHub's IP ranges with 403 --
# for the HTML pages and for the static CSV exports alike, verified with a probe
# workflow -- while the same requests succeed from a residential IP. So a
# scheduled run here could only ever exit 75, which produced a monthly "success"
# that never refreshed anything: silent staleness, the exact failure mode the
# freshness watchdog was added to catch.
#
# This feed now runs on a self-hosted runner in the private repo
# duncanburns2013-dot/ma-data-hub-runner, which fetches from a residential IP and
# pushes here. See that repo's README.
#
# Kept dispatchable so the CSV-drop path still works by hand, and so this starts
# passing again on its own if CBP ever unblocks the range.
on:
  push:
    paths:
      - "update-cbp-encounters.py"
      - "data/cbp-encounters-latest.csv"   # Trigger on manual CSV drop
  workflow_dispatch:

jobs:
  update-cbp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch CBP encounter data
        id: fetch
        run: |
          set +e
          python update-cbp-encounters.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "blocked=false" >> $GITHUB_OUTPUT
          elif [ "$code" -eq 75 ]; then
            # cbp.gov's bot filter shut us out. Transient and self-healing, and
            # nothing was written -- so this is a skip, not a build failure.
            echo "::notice::cbp.gov blocked the fetch - nothing written. Next run will retry."
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "::error::update-cbp-encounters.py failed with exit code $code"
            exit "$code"
          fi

      - name: Check for changes
        id: changes
        if: steps.fetch.outputs.blocked == 'false'
        run: |
          git diff --quiet -- '*.html' 'data/*.json' \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add immigration-dashboard.html data/cbp-encounters-latest.json
          git commit -m "Auto-update: CBP encounter data $(date +'%B %Y')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "CBP data unchanged - no commit needed."

      # Reports what the run produced. Must never be able to fail the job: it used
      # to read d["auto_fetched"], a key this script has never written, so with
      # `if: always()` it raised KeyError and turned every run red -- including
      # the ones that fetched and committed perfectly.
      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          echo "### CBP Encounter Update" >> $GITHUB_STEP_SUMMARY
          if [ -f data/cbp-encounters-latest.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("data/cbp-encounters-latest.json"))
          print(f"Fetched at: {d.get('fetched_at', 'unknown')}")
          print(f"Measure: {d.get('measure', 'unknown')}")
          for fy, v in sorted(d.get("fy_totals", {}).items()):
              print(f"- {fy}: {v['total']:,} "
                    f"({v['months_reported']} months, {v['first_month']}-{v['last_month']})")
          PY
          fi
