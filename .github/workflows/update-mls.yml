# .github/workflows/update-mls.yml
#
# Refreshes MLS PIN figures in ma-housing-dashboard.html,
# haverhill-market-report.html, and MASTER_DATA.md from the Bridge API.
#
# Two windows, one source (see update-mls-figures.py's docstring):
#   - the TRAILING-12-MONTH tail is refetched on every run (~29 queries, seconds);
#   - per-CALENDAR-YEAR history lives in data/mls-history.json and is fetched only
#     when the backfill_history input is set. A full pass is ~1M rows / ~5,000
#     requests / ~20-40min, so it must not run nightly: it would burn the Bridge
#     rate limit rewriting identical digits for years that have already closed.
#
# To have MLS take ownership of the historical years (and after each January
# rollover, to add the year that just completed):
#     gh workflow run update-mls.yml -f backfill_history=true
# It is incremental — only (market, type, year) cells missing from the cache are
# fetched — so a re-run after a timeout resumes instead of restarting.
#
# Requires repository secret BRIDGE_TOKEN (Bridge Interactive server token, scoped
# to the MLS PIN dataset). NOT PrimeMLS — that is the separate NH feed, driven by
# update-nh.yml.

name: Update MLS Figures

on:
  schedule:
    # 07:00 UTC daily = 03:00 ET (EDT) / 02:00 ET (EST) — overnight, low-traffic
    - cron: "0 7 * * *"
  push:
    paths:
      - "update-mls-figures.py"
      - "update-price-distribution.js"
      - "update-housing-history.js"
      - ".github/workflows/update-mls.yml"
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "Also fetch missing per-calendar-year history into data/mls-history.json (slow: ~20-40min)"
        type: boolean
        default: false

jobs:
  update-mls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Prevent two MLS runs from racing each other
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Refresh MLS figures
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        # --backfill-history only when explicitly asked for. The push trigger above
        # fires this workflow on every edit to the script, so defaulting it on would
        # mean a ~5,000-request pass every time someone fixes a comment.
        run: |
          if [ "${{ inputs.backfill_history }}" = "true" ]; then
            python update-mls-figures.py --backfill-history
          else
            python update-mls-figures.py
          fi

      # Both skipped on a backfill. That pass populates data/mls-history.json and exits
      # before the tail, having just spent the Bridge quota — price-distribution would do
      # nothing but 429, fail the job, and take the freshly-fetched cache down with it.
      # A backfill commits the cache and nothing else; the nightly runs these as normal.
      - name: Refresh price-distribution tab
        if: ${{ inputs.backfill_history != true }}
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: node update-price-distribution.js

      - name: Refresh historical-context panel
        if: ${{ inputs.backfill_history != true }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node update-housing-history.js

      - name: Check for changes
        id: changes
        run: |
          # git status, not git diff: the first backfill CREATES data/mls-history.json, and
          # git diff only reports tracked files — a brand-new cache would read as "no
          # change" and be thrown away instead of committed.
          if [ -n "$(git status --porcelain -- ma-housing-dashboard.html haverhill-market-report.html MASTER_DATA.md data/mls-history.json data/price-distribution-latest.json data/housing-history-latest.json)" ]; then
            echo "changed=true"  >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ma-housing-dashboard.html haverhill-market-report.html MASTER_DATA.md data/price-distribution-latest.json data/housing-history-latest.json
          # data/mls-history.json exists only once a backfill has populated it
          # (-f backfill_history=true). A tail-only run never writes it, and `git add`
          # fatals on a pathspec that matches nothing — which broke every nightly.
          if [ -f data/mls-history.json ]; then
            git add data/mls-history.json
          fi
          git commit -m "Auto-update: MLS PIN figures $(date -u +'%Y-%m-%d')"
          # Retry push up to 5 times, rebasing on each rejection (handles concurrent pushes)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "MLS figures unchanged - no commit needed."
