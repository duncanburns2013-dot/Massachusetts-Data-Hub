# .github/workflows/update-nh.yml
# Daily refresh, with the PC task (Task Scheduler -> run_nh_update.bat) as a
# redundant second path. Either can commit; whichever runs second finds no changes
# and exits cleanly.
#
# History: the cron was disabled because PrimeMLS/Cloudflare throttles GitHub's
# datacenter IPs and a throttled run emailed a failure every time. Two things
# changed that. (1) The low-volume redesign genuinely works from CI — runs on
# 2026-07-10/11/12 all succeeded in ~2m20s. (2) A throttled pull now exits 75
# instead of 1 and is reported here as a neutral skip, so it no longer produces
# failure mail. The safe-write guard still means nothing is ever published from a
# truncated pull.
name: Update NH Figures

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"   # 07:20 UTC daily

jobs:
  update-nh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild NH figures (recent months + towns + active; history from committed aggregates)
        id: pull
        env:
          PRIMEMLS_CLIENT_ID: ${{ secrets.PRIMEMLS_CLIENT_ID }}
          PRIMEMLS_CLIENT_SECRET: ${{ secrets.PRIMEMLS_CLIENT_SECRET }}
        run: |
          set +e
          python update-nh-figures.py all
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "throttled=false" >> $GITHUB_OUTPUT
          elif [ "$code" -eq 75 ]; then
            # Expected and self-healing: the feed throttled us and the safe-write
            # guard refused to publish a truncated pull. Not a failure.
            echo "::notice::PrimeMLS pull was throttled/truncated - nothing written. Next run will retry."
            echo "throttled=true" >> $GITHUB_OUTPUT
          else
            echo "::error::update-nh-figures.py failed with exit code $code"
            exit "$code"
          fi
      - name: Check for changes
        id: changes
        if: steps.pull.outputs.throttled == 'false'
        run: |
          git diff --quiet -- data/nh-figures.json data/nh-state-monthly.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT
      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nh-figures.json data/nh-state-monthly.json
          git commit -m "Auto-update: NH PrimeMLS figures $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"; exit 1
      - name: Purge jsDelivr cache
        if: steps.changes.outputs.changed == 'true'
        run: curl -s "https://purge.jsdelivr.net/gh/duncanburns2013-dot/Massachusetts-Data-Hub@main/data/nh-figures.json" || true
      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "NH figures unchanged - no commit needed."
