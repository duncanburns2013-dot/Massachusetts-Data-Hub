# .github/workflows/update-census.yml
#
# Fetches ACS 5-Year data (foreign-born %, multilingual %, median income)
# from the Census Bureau API. New ACS vintages typically drop in September.
# Runs monthly + on demand.

name: Update Census Data (ACS)

on:
  schedule:
    # 10:00 UTC on the 20th of each month
    - cron: "0 10 20 * *"
  push:
    paths:
      - "update-census-data.py"
  workflow_dispatch:

jobs:
  update-census:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Census data and update dashboards
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-census-data.py

      # Consumes data/census-latest.json for its income benchmark, so it runs
      # after the Census step. BEA price parities are annual; monthly is ample.
      - name: Rebuild cost-of-living dataset (BEA + MIT)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python update-cost-of-living.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- '*.html' 'data/*.json' \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit updated dashboards
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add immigration-dashboard.html affordability-dashboard.html
          git add data/census-latest.json data/cost-of-living-latest.json
          git commit -m "Auto-update: Census ACS data $(date +'%B %Y')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "Census data unchanged - no commit needed."
