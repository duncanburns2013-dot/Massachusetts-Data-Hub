# CTHRU posts the Comptroller's checkbook daily, so this runs daily. The
# payments inside it lag about a month -- payments through 17 Sep were posted on
# 20 Oct -- which is the source's cadence, not a fault, and the page says so.
#
# No API key: both datasets are open Socrata endpoints on cthru.data.socrata.com.
name: Update Shelter & Immigrant Spending

on:
  schedule:
    - cron: "15 11 * * *"   # 07:15 ET, after the overnight CTHRU posting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A normal pass is well under a minute. 20 minutes turns any runaway into a
    # red job rather than a silent cancellation six hours later -- the failure
    # mode that cost update-census a month.
    timeout-minutes: 20

    concurrency:
      group: update-immigrant-spending
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh appropriations and recipients from CTHRU
        run: python update-immigrant-spending.py

      - name: Fetch the IRS exempt-organizations file (Massachusetts)
        run: |
          mkdir -p data/_raw_irs
          curl -sS --fail --max-time 180 -A "MA-Data-Hub/1.0"             -o data/_raw_irs/eo_ma.csv             https://www.irs.gov/pub/irs-soi/eo_ma.csv
          wc -l data/_raw_irs/eo_ma.csv

      - name: Verify recipient tax status against the IRS file
        run: python scripts/verify-nonprofit-status.py

      - name: Commit if changed
        # No !cancelled() guard here, deliberately. It used to carry one, on
        # the reasoning that the updater exits 75 and writes nothing on a
        # CTHRU outage so there was nothing to lose. That was not true: on
        # 2026-11-05 the updater wrote the file and THEN hit the outage, the
        # IRS fetch and verify steps were skipped, and this step committed
        # the result anyway, deleting the mira and recipients.irs_check
        # blocks from the live file. The guard is only safe where every
        # step writes all-or-nothing, and this pipeline does not.
        #
        # Plain implicit success() is the correct rule here: publish only a
        # complete build. A partial one leaves yesterday's intact file up,
        # which is what the exit-75 contract promises anyway.
        run: |
          if git diff --quiet -- 'data/immigrant-spending-latest.json' immigration-dashboard.html MASTER_DATA.md; then
            echo "No change - CTHRU has not moved since the last run."
            exit 0
          fi
          # The paths changed on 2026-10-22: the Money Trail content moved into
          # immigration-dashboard.html and shelter-immigrant-spending.html became
          # a redirect stub, so this step was staging a file the updater no longer
          # writes -- every CTHRU refresh was being dropped. MASTER_DATA.md is
          # staged for the same reason the energy workflow now stages it.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'data/immigrant-spending-latest.json' immigration-dashboard.html MASTER_DATA.md
          git commit -m "Auto-update: shelter and immigrant spending (CTHRU)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::notice::Another run already updated this - skipping."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
