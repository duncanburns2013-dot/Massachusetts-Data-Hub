# .github/workflows/update-irs-soi.yml
#
# Checks for new IRS SOI migration data and refreshes
# data/irs-soi-migration-latest.json. It does NOT edit any dashboard: applying a
# new migration year takes ~80 changes across tax-budget-dashboard.html,
# including prose judgements about rank and direction, so the script reports and
# warns instead. check-consistency.py is what then fails until the register and
# dashboard are brought up to date.
#
# Observed lag is ~2 years, and the release month is not predictable: 2022-23
# landed March 2026 and 2023-24 landed 19 November 2026. Runs monthly.

name: Update IRS SOI Migration

on:
  schedule:
    # 14:00 UTC on the 1st of each month
    - cron: "0 14 1 * *"
  push:
    paths:
      - "update-irs-soi-migration.py"
  workflow_dispatch:

jobs:
  update-irs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: push-to-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch IRS SOI migration data
        run: python update-irs-soi-migration.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- 'data/*.json' \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/irs-soi-migration-latest.json
          git commit -m "Auto-update: IRS SOI migration data $(date +'%B %Y')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected - pulling latest and rebasing"
            if ! git pull --rebase origin main; then
              # A CONFLICT here is not a merge to resolve: every file this workflow
              # commits is regenerated wholesale, so both sides are the same window's
              # data and the other side is already on main. Rebasing again just hits
              # the same conflict until the loop gives up and reports a data problem
              # that does not exist. Abort and skip. (Seen on update-mls, 2026-08-11.)
              git rebase --abort || true
              echo "::notice::Another run already published this window's data (rebase conflicts on generated files) - skipping, nothing lost."
              exit 0
            fi
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: No new data
        if: steps.changes.outputs.changed == 'false'
        run: echo "IRS data unchanged - no commit needed."

      - name: Job summary
        if: always()
        run: |
          echo "### IRS SOI Migration Update" >> $GITHUB_STEP_SUMMARY
          if [ -f data/irs-soi-migration-latest.json ]; then
            python -c "
          import json
          d = json.load(open('data/irs-soi-migration-latest.json'))
          print(f'Verified: {d[\"latest_year_verified\"]}')
          new = d.get('new_year_found')
          print(f'New year: {new or \"None yet\"}')
          if new:
              print(f'**A new year has been released. tax-budget-dashboard.html and MASTER_DATA.md need a manual pass.**')
          " >> $GITHUB_STEP_SUMMARY
          fi
