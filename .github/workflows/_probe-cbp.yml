name: _probe cbp csv
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can CI reach the CBP static CSV?
        run: |
          for u in \
            "https://www.cbp.gov/sites/default/files/2026-08/nationwide-encounters-fy23-fy26-jul-state.csv" \
            "https://www.cbp.gov/document/stats/nationwide-encounters" ; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' -m 60 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "$u")
            echo "PROBE $code $(stat -c%s /tmp/o 2>/dev/null) bytes :: $u"
            head -c 120 /tmp/o | tr -d '\0' | head -2
            echo "---"
          done
